name: Build PS4 Mesa stack

on:
  workflow_dispatch:
    inputs:
      lib32:
        description: 'Also build the lib32 (multilib) variants'
        type: boolean
        default: false
      rolling:
        description: 'Also refresh the rolling "latest" tag'
        type: boolean
        default: true
      llvm_version:
        description: 'Build the 64-bit mesa against this llvm/llvm-libs from the Arch archive (e.g. 22.1.6). Empty = current Arch.'
        required: false
        default: ''

concurrency:
  group: ps4-mesa-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    env:
      REPO_DIR: repo
      REPO_NAME: ps4-video

    steps:
      # ---------------------------------------------------------------- setup
      - name: Bootstrap pacman + git (needed before checkout in container)
        shell: bash
        run: |
          set -euxo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize Arch (full update + multilib)
        shell: bash
        run: |
          set -euxo pipefail
          # enable multilib for real: the usual "sed the comments away" trick is
          # fragile and silently left only core+extra in the sync set
          if ! grep -qE '^\[multilib\]' /etc/pacman.conf; then
            sed -i '/#\[multilib\]/,/Include/s/^#//' /etc/pacman.conf
          fi
          if ! grep -qE '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          fi
          grep -A1 -E '^\[multilib\]' /etc/pacman.conf
          pacman -Syu --noconfirm
          n=$(pacman -Slq multilib | wc -l)
          echo "multilib packages visible: $n"
          [ "$n" -gt 0 ] || { echo "::error::multilib repo not enabled"; exit 1; }

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          pacman -S --noconfirm --needed \
            base-devel sudo fakeroot \
            github-cli zstd
          pacman -Scc --noconfirm

      - name: Create builder user
        shell: bash
        run: |
          set -euxo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------- LLVM pin
      - name: Pin LLVM to the console's version (64-bit)
        if: inputs.llvm_version != ''
        shell: bash
        run: |
          set -euxo pipefail
          V="${{ inputs.llvm_version }}"
          mkdir -p /tmp/llvmpin && cd /tmp/llvmpin
          for p in llvm llvm-libs; do
            f="${p}-${V}-1-x86_64.pkg.tar.zst"
            curl -fL --retry 3 --max-time 600 -o "$f" \
              "https://archive.archlinux.org/packages/l/${p}/${f}"
          done
          pacman -Udd --noconfirm \
            "./llvm-libs-${V}-1-x86_64.pkg.tar.zst" "./llvm-${V}-1-x86_64.pkg.tar.zst"
          pacman -Q llvm llvm-libs
          llvm-config --version

          # A rebuild against a different LLVM is a packaging change, not a new
          # upstream version: bump pkgrel so it can never be mistaken for (or
          # silently replace) the stock-LLVM build of the same mesa version.
          sed -i 's/^pkgrel=[0-9]*/pkgrel=2/' "$GITHUB_WORKSPACE/mesa-ps4/PKGBUILD"
          grep -m1 '^pkgrel=' "$GITHUB_WORKSPACE/mesa-ps4/PKGBUILD"

      - name: Build libdrm-ps4 (base for both 32- and 64-bit)
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/$REPO_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$REPO_DIR"
          cd "$GITHUB_WORKSPACE/libdrm-ps4"
          sudo -u builder bash -c "cd '$GITHUB_WORKSPACE/libdrm-ps4' && makepkg -sfc --noconfirm --nocheck --skippgpcheck"
          f=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          [ -n "$f" ] || { echo "::error::no libdrm-ps4 package"; exit 1; }
          cp "$f" "$GITHUB_WORKSPACE/$REPO_DIR/"
          pacman -Rdd --noconfirm libdrm || true
          pacman -U --noconfirm "$f"

      - name: Check disk headroom
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free: ${avail}G"
          if [ "$avail" -lt 10 ]; then
            echo "::error::Only ${avail}G free. A mesa + LLVM build needs ~10G."
            exit 1
          fi

      # ------------------------------------------------------------ 64-bit pass
      - name: Build 64-bit packages
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$REPO_DIR"

          build64() {
            local pkg="$1"
            echo "=== BUILDING $pkg ==="
            cd "$GITHUB_WORKSPACE/$pkg"
            sudo -u builder bash -c "
              cd '$GITHUB_WORKSPACE/$pkg' &&
              makepkg -sfc --noconfirm --nocheck --skippgpcheck
            "
            local f
            f=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
            [ -n "$f" ] || { echo "::error::no package produced for $pkg"; exit 1; }
            cp "$f" "$GITHUB_WORKSPACE/$REPO_DIR/"
            pacman -Rdd --noconfirm mesa || true
            pacman -U --noconfirm "$f"
            df -h /
          }

          build64 mesa-ps4
          build64 xf86-video-amdgpu-ps4

      # ------------------------------------------------------------ 32-bit pass
      # Runs after the 64-bit packages on purpose: lib32-mesa-ps4 declares
      # 'mesa-ps4' as a dependency, and lib32-libdrm-ps4 needs 'libdrm-ps4'.
      # Installing lib32-llvm here is harmless now - the pinned 64-bit mesa is
      # already compiled - and the package itself is LLVM-free anyway.
      - name: Build 32-bit packages
        if: inputs.lib32
        shell: bash
        run: |
          set -euxo pipefail

          build32() {
            local pkg="$1"
            echo "=== BUILDING $pkg (32-bit) ==="
            cd "$GITHUB_WORKSPACE/$pkg"
            sudo -u builder bash -c "
              cd '$GITHUB_WORKSPACE/$pkg' &&
              makepkg -sfc --noconfirm --nocheck --skippgpcheck
            "
            local f
            f=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
            [ -n "$f" ] || { echo "::error::no package produced for $pkg"; exit 1; }
            cp "$f" "$GITHUB_WORKSPACE/$REPO_DIR/"
            # one target per call: pacman aborts the whole removal if any named
            # target is absent, which would leave the conflicting package behind
            pacman -Rdd --noconfirm lib32-mesa || true
            pacman -Rdd --noconfirm lib32-libdrm || true
            pacman -U --noconfirm "$f"
            df -h /
          }

          build32 lib32-libdrm-ps4
          build32 lib32-mesa-ps4

      # ----------------------------------------------------------- verify + db
      - name: Verify LLVM linkage of the 64-bit package
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"
          pkg=$(find . -maxdepth 1 -name 'mesa-ps4-*.pkg.tar.zst' -print -quit)
          dep=$(tar --zstd -xOf "$pkg" .PKGINFO | sed -n 's/^depend = libLLVM\.so=\(.*\)-64$/\1/p')
          echo "mesa-ps4 requires libLLVM.so=${dep:-<none>}"
          want="${{ inputs.llvm_version }}"
          if [ -n "$want" ] && [ "${dep}" != "${want%.*}" ]; then
            echo "::error::built against libLLVM.so=${dep} but pin asked for ${want%.*}"
            exit 1
          fi
          if [ "${{ inputs.lib32 }}" = "true" ]; then
            l32=$(find . -maxdepth 1 -name 'lib32-mesa-ps4-*.pkg.tar.zst' -print -quit)
            l32dep=$(tar --zstd -xOf "$l32" .PKGINFO | sed -n 's/^depend = libLLVM\.so=\(.*\)-64$/\1/p')
            echo "lib32-mesa-ps4 requires libLLVM.so=${l32dep:-<none> (LLVM-free build)}"
          fi

      - name: Create pacman repo db
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"

          repo-add "$REPO_NAME.db.tar.zst" ./*.pkg.tar.zst

          # GitHub Releases do not preserve symlinks, and pacman asks for
          # "<Server>/ps4-video.db" -> ship real files under those names.
          # repo-add leaves .db as a symlink to .db.tar.zst, so drop it first
          # (cp refuses when source and destination are the same file).
          rm -f "$REPO_NAME.db" "$REPO_NAME.files"
          cp -f "$REPO_NAME.db.tar.zst" "$REPO_NAME.db"
          if [ -f "$REPO_NAME.files.tar.zst" ]; then
            cp -f "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"
          fi

          ls -la

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"

          # mesa-ps4-26.2.6-2-x86_64.pkg.tar.zst -> mesa-26.2.6-2
          # find prints "./name", so strip the path first (this produced the
          # bogus tag "mesa-./mesa-ps4-..." in run 42815063773)
          pkg=$(find . -maxdepth 1 -name 'mesa-ps4-*.pkg.tar.zst' -print -quit)
          pkg=${pkg##*/}
          ver=${pkg#mesa-ps4-}
          ver=${ver%-x86_64.pkg.tar.zst}
          tag="mesa-${ver}"

          if [ -n "${{ inputs.llvm_version }}" ]; then
            tag="${tag}-llvm${{ inputs.llvm_version }}"
          fi

          echo "TAG=${tag}" | tee -a "$GITHUB_ENV"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------- publish
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"

          ASSETS=(./*.pkg.tar.zst "./$REPO_NAME.db" "./$REPO_NAME.db.tar.zst")
          if [ -f "$REPO_NAME.files" ]; then
            ASSETS+=("./$REPO_NAME.files" "./$REPO_NAME.files.tar.zst")
          fi

          LLVM_PIN="${{ inputs.llvm_version }}"
          if [ -n "$LLVM_PIN" ]; then
            LLVM_NOTE="64-bit mesa built against llvm/llvm-libs **${LLVM_PIN}** — requires libLLVM.so=${LLVM_PIN%.*}."
          else
            LLVM_NOTE="64-bit mesa built against the current Arch llvm."
          fi
          if [ "${{ inputs.lib32 }}" = "true" ]; then
            LLVM_NOTE="$LLVM_NOTE
          32-bit mesa is built with **no LLVM at all** (\`-D llvm=disabled -D amd-use-llvm=false\`, radeonsi on ACO), so it has no libLLVM dependency and works with any lib32 llvm-libs."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "Built from ${GITHUB_SHA::12} on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          $LLVM_NOTE"
          fi

          if [ "${{ inputs.rolling }}" = "true" ]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest "${ASSETS[@]}" \
              --title "PS4 Mesa (latest)" \
              --notes "Rolling alias for $TAG.

          $LLVM_NOTE

          \`\`\`
          [ps4-video]
          SigLevel = Optional
          Server = https://github.com/${GH_REPO}/releases/download/latest
          \`\`\`"
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Built \`$TAG\`"
            echo
            echo "| package | size |"
            echo "|---|---|"
            for f in "$GITHUB_WORKSPACE/$REPO_DIR"/*.pkg.tar.zst; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "pacman:"
            echo '```'
            echo "[ps4-video]"
            echo "SigLevel = Optional"
            echo "Server = https://github.com/${{ github.repository }}/releases/download/latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-video-packages
          path: repo/*.pkg.tar.zst
          if-no-files-found: warn
