name: Build PS4 Mesa stack

on:
  workflow_dispatch:
    inputs:
      lib32:
        description: 'Also build the lib32 (multilib) variants'
        type: boolean
        default: false
      rolling:
        description: 'Also refresh the rolling "latest" tag'
        type: boolean
        default: true

concurrency:
  group: ps4-mesa-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    env:
      REPO_DIR: repo
      REPO_NAME: ps4-video

    steps:
      # ---------------------------------------------------------------- setup
      - name: Bootstrap pacman + git (needed before checkout in container)
        shell: bash
        run: |
          set -euxo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize Arch (full update + multilib)
        shell: bash
        run: |
          set -euxo pipefail
          sed -i '/#\[multilib\]/,/Include/s/^#//' /etc/pacman.conf
          pacman -Syu --noconfirm

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          pacman -S --noconfirm --needed \
            base-devel sudo fakeroot \
            github-cli zstd

          # the package cache is dead weight on a 14 GB runner
          pacman -Scc --noconfirm

      - name: Create builder user
        shell: bash
        run: |
          set -euxo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check disk headroom
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free: ${avail}G"
          if [ "$avail" -lt 12 ]; then
            echo "::error::Only ${avail}G free. A mesa + LLVM build needs ~10-12G."
            echo "Use the chroot workflow (.github/workflows/buildtarball.yml), which"
            echo "runs on the runner rootfs and can free the preinstalled toolchains."
            exit 1
          fi

      # ---------------------------------------------------------------- build
      - name: Build packages
        shell: bash
        run: |
          set -euxo pipefail

          # start from a clean repo dir: committed binaries from earlier
          # builds must never be re-published
          rm -rf "$GITHUB_WORKSPACE/$REPO_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$REPO_DIR"

          build_and_install() {
            local pkg="$1"
            echo "=== BUILDING $pkg ==="

            cd "$GITHUB_WORKSPACE/$pkg"

            sudo -u builder bash -c "
              cd '$GITHUB_WORKSPACE/$pkg' &&
              makepkg -sfc --noconfirm --skippgpcheck
            "

            local pkg_file
            pkg_file=$(find . -maxdepth 1 -name '*.pkg.tar.zst' | head -n1)
            [ -n "$pkg_file" ] || { echo "::error::no package produced for $pkg"; exit 1; }

            cp "$pkg_file" "$GITHUB_WORKSPACE/$REPO_DIR/"

            pacman -Rdd --noconfirm mesa       || true
            pacman -Rdd --noconfirm lib32-mesa || true
            pacman -U --noconfirm "$pkg_file"

            df -h /
          }

          build_and_install libdrm-ps4
          build_and_install mesa-ps4
          build_and_install xf86-video-amdgpu-ps4

          if [ "${{ inputs.lib32 }}" = "true" ]; then
            build_and_install lib32-libdrm-ps4
            build_and_install lib32-mesa-ps4
          fi

      # ----------------------------------------------------------- repo + tag
      - name: Create pacman repo db
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"

          repo-add "$REPO_NAME.db.tar.zst" ./*.pkg.tar.zst

          # GitHub Releases do not preserve symlinks, and pacman asks for
          # "<Server>/ps4-video.db" -> ship real files under those names.
          cp -f "$REPO_NAME.db.tar.zst" "$REPO_NAME.db"
          if [ -f "$REPO_NAME.files.tar.zst" ]; then
            cp -f "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"
          fi

          ls -la

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"

          # mesa-ps4-26.2.5-1-x86_64.pkg.tar.zst -> mesa-26.2.5-1
          pkg=$(ls mesa-ps4-*.pkg.tar.zst | head -n1)
          ver=${pkg#mesa-ps4-}
          ver=${ver%-x86_64.pkg.tar.zst}
          echo "TAG=mesa-${ver}" | tee -a "$GITHUB_ENV"
          echo "tag=mesa-${ver}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------- publish
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/$REPO_DIR"

          ASSETS=(./*.pkg.tar.zst "./$REPO_NAME.db" "./$REPO_NAME.db.tar.zst")
          if [ -f "$REPO_NAME.files" ]; then
            ASSETS+=("./$REPO_NAME.files" "./$REPO_NAME.files.tar.zst")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "Built from ${GITHUB_SHA::12} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          fi

          if [ "${{ inputs.rolling }}" = "true" ]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest "${ASSETS[@]}" \
              --title "PS4 Mesa (latest)" \
              --notes "Rolling alias for $TAG.

          \`\`\`
          [ps4-video]
          SigLevel = Optional
          Server = https://github.com/${GH_REPO}/releases/download/latest
          \`\`\`"
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Built \`$TAG\`"
            echo
            echo "| package | size |"
            echo "|---|---|"
            for f in "$GITHUB_WORKSPACE/$REPO_DIR"/*.pkg.tar.zst; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "pacman:"
            echo '```'
            echo "[ps4-video]"
            echo "SigLevel = Optional"
            echo "Server = https://github.com/${{ github.repository }}/releases/download/latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-video-packages
          path: repo/*.pkg.tar.zst
          if-no-files-found: warn
